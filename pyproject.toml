[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-spice"
version = "0.1.0"
description = "Equation-Grounded AI Analog & RF Circuit Engineering Framework with Closed-Loop LTspice Verification and Clean Schematic (.asc) Compilation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Caio Carlos Missfeld"}
]
keywords = [
    "spice",
    "ltspice",
    "analog-circuit-design",
    "rf-engineering",
    "eda",
    "ai-agent",
    "mcp",
    "schematic-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
pdf = [
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
ia-spice = "ia_spice.cli:main"

[project.urls]
Homepage = "https://github.com/Caiobinha1/IA-SPICE"
Repository = "https://github.com/Caiobinha1/IA-SPICE.git"
Issues = "https://github.com/Caiobinha1/IA-SPICE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
