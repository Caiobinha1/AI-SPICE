name: IA-SPICE CI & Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-drc-tests:
    name: Python Unit, Parser, Sizing & Schematic DRC Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Analytical Sizing, Parser, Reporting & Geometric DRC Tests
        run: |
          python -m unittest tests/test_step1_sizing.py tests/test_step4_reporting.py -v
